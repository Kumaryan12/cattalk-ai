<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CatTalk helps you read visible cat behavior and choose a gentle interaction.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6D4BC3">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CatTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CatTalk for Mrunali — Happy Birthday!</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; min-height: 100%; background: #F9F6F1; }
    #cattalk-loading {
      position: fixed; inset: 0; z-index: 9999; display: grid;
      place-items: center; background: linear-gradient(145deg, #FFFDF9, #F1EAFF);
      color: #211C2B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 220ms ease;
    }
    .cattalk-loader { text-align: center; }
    .cattalk-mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 22px;
      display: grid; place-items: center; background: linear-gradient(145deg, #7959D2, #51359B);
      box-shadow: 0 16px 38px rgba(81, 53, 155, .24); color: white; font-size: 30px;
      animation: cattalk-breathe 1.4s ease-in-out infinite alternate;
    }
    .cattalk-loader strong { display: block; font-size: 21px; letter-spacing: -.4px; }
    .cattalk-loader span { display: block; margin-top: 6px; color: #6C6475; font-size: 14px; }
    @keyframes cattalk-breathe { to { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(81, 53, 155, .3); } }
  </style>

  <!-- TensorFlow.js + COCO-SSD object detection model -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

  <script>
    let catDetectorModel = null;

    async function loadCatDetectorModel() {
      if (!catDetectorModel) {
        catDetectorModel = await cocoSsd.load();
        console.log("COCO-SSD model loaded");
      }
      return true;
    }

    async function detectCatFromImageElement(imageElementId) {
      await loadCatDetectorModel();

      const img = document.getElementById(imageElementId);

      if (!img) {
        return {
          catDetected: false,
          confidence: 0,
          message: "Image element not found",
          bbox: null
        };
      }

      const predictions = await catDetectorModel.detect(img);

      const catPrediction = predictions.find(
        (prediction) => prediction.class === "cat"
      );

      if (!catPrediction) {
        return {
          catDetected: false,
          confidence: 0,
          message: "No cat detected",
          bbox: null
        };
      }

      return {
        catDetected: true,
        confidence: catPrediction.score,
        message: "Cat detected using COCO-SSD",
        bbox: catPrediction.bbox
      };
    }
  </script>
</head>
<body>
  <div id="cattalk-loading" role="status" aria-label="Loading CatTalk">
    <div class="cattalk-loader">
      <div class="cattalk-mark">♥</div>
      <strong>CatTalk</strong>
      <span>A birthday surprise for Mrunali…</span>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('cattalk-loading');
      if (!loader) return;
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 240);
    });
  </script>
</body>
</html>
